services:

  mysql:
    image: mysql:8.4
    container_name: employee-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_PASSWORD}
      MYSQL_DATABASE: employee_db
    volumes:
      - employee_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_TEST_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: employee-backend
    ports:
      - "8080:8080"
    environment:
      DB_PASSWORD: ${MYSQL_TEST_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/employee_db
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: employee-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  employee_mysql_data:
